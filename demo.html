<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FM Ultra Manager 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(23, 31, 48, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.25);
      --accent: #4facfe;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(79, 172, 254, 0.08) 0px, transparent 50%);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      padding: 16px;
    }

    /* Navigation Header */
    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 16px 24px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-stats {
      display: flex;
      gap: 20px;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--bg-card-border);
    }
    .stat-val { color: var(--primary); font-weight: 700; }

    /* Layout */
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 1024px) {
      .dashboard { grid-template-columns: 360px 1fr; }
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Buttons */
    .btn {
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #040d1a;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

    /* Match Box */
    .match-card {
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, rgba(0,242,254,0.03) 0%, rgba(0,0,0,0) 100%);
      border-radius: 12px;
      border: 1px solid var(--bg-card-border);
    }

    .versus-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 16px 0;
    }

    .team-box { width: 40%; }
    .team-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .score { font-family: var(--font-mono); font-size: 32px; font-weight: 800; color: var(--primary); }

    /* Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--bg-card-border);
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(0, 242, 254, 0.1);
      color: var(--primary);
    }

    /* Player Table & Rows */
    .player-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 36px 1fr 45px 45px 45px 70px;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .player-row:hover {
      border-color: var(--bg-card-border);
      background: rgba(255, 255, 255, 0.05);
    }

    .pos-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
      text-align: center;
    }
    .pos-gk { background: #f59e0b22; color: #f59e0b; }
    .pos-df { background: #3b82f622; color: #3b82f6; }
    .pos-mf { background: #10b98122; color: #10b981; }
    .pos-fw { background: #ef444422; color: #ef4444; }

    /* Standings Table */
    .table-row {
      display: grid;
      grid-template-columns: 28px 1fr 35px 35px 40px 35px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: var(--font-mono);
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .table-row.user-team {
      background: rgba(0, 242, 254, 0.1);
      color: var(--primary);
      font-weight: bold;
      border-radius: 6px;
    }

    /* Select Inputs */
    select {
      background: var(--bg-dark);
      color: var(--text);
      border: 1px solid var(--bg-card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: var(--font-main);
    }

    /* Live Commentary Log */
    #commentary-box {
      height: 140px;
      overflow-y: auto;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ FM ULTRA MANAGER 2026</div>
    <div class="header-stats">
      <div class="stat-badge">Bütçe: <span id="budget-val" class="stat-val">$0</span></div>
      <div class="stat-badge">Lig: <span id="league-name-val" class="stat-val">Süper Lig</span></div>
      <div class="stat-badge">Sezon: <span id="season-val" class="stat-val">1</span></div>
    </div>
  </header>

  <div class="dashboard">
    <!-- SOL KOLON: MAÇ VE TAKTİK EKANI -->
    <div class="left-col">
      <div class="card">
        <div class="card-title">
          <span>Maç Haftası <span id="week-val">1</span>/22</span>
          <span id="tactics-rating" style="color:var(--primary); font-family:var(--font-mono);">Güç: %0</span>
        </div>

        <div class="match-card">
          <div class="versus-container">
            <div class="team-box">
              <div class="team-name" id="home-team-name">Takımım</div>
              <div class="score" id="home-score">0</div>
            </div>
            <div style="font-weight:bold; color:var(--text-muted)">VS</div>
            <div class="team-box">
              <div class="team-name" id="away-team-name">Rakip</div>
              <div class="score" id="away-score">0</div>
            </div>
          </div>

          <div style="margin-top: 12px;">
            <button id="play-btn" class="btn btn-primary" style="width:100%" onclick="playMatch()">Maçı Başlat</button>
          </div>
        </div>

        <div id="commentary-box" style="display:none;"></div>
      </div>

      <div class="card">
        <div class="card-title">Taktik ve Kurulum</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <label style="font-size:13px;">Diziliş:</label>
          <select id="formation-select" onchange="changeTactics()">
            <option value="4-3-3">4-3-3</option>
            <option value="4-4-2">4-4-2</option>
            <option value="3-5-2">3-5-2</option>
          </select>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:13px;">Zihniyet:</label>
          <select id="mentality-select" onchange="changeTactics()">
            <option value="attack">Hücum</option>
            <option value="balanced" selected>Dengeli</option>
            <option value="defend">Savunma</option>
          </select>
        </div>
      </div>
    </div>

    <!-- SAĞ KOLON: KADRO / PAZAR / PUAN DURUMU -->
    <div class="right-col">
      <div class="card">
        <div class="nav-tabs">
          <button class="tab-btn active" onclick="switchTab('squad')">Kadro Oyuncuları</button>
          <button class="tab-btn" onclick="switchTab('transfer')">Transfer Pazarı</button>
          <button class="tab-btn" onclick="switchTab('table')">Puan Durumu</button>
        </div>

        <!-- TAB 1: KADRO -->
        <div id="tab-squad" class="tab-content">
          <div class="player-grid" id="squad-list"></div>
        </div>

        <!-- TAB 2: TRANSFER -->
        <div id="tab-transfer" class="tab-content" style="display:none;">
          <div style="margin-bottom:12px; font-size:13px; color:var(--text-muted);">Serbest Oyuncular Listesi:</div>
          <div class="player-grid" id="transfer-list"></div>
        </div>

        <!-- TAB 3: LİG PUAN DURUMU -->
        <div id="tab-table" class="tab-content" style="display:none;">
          <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="renderLeagueTable(0)">Süper Lig</button>
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="renderLeagueTable(1)">1. Lig</button>
          </div>
          <div class="table-row" style="font-weight:bold; color:var(--text-muted);">
            <span>#</span><span>Takım</span><span>O</span><span>AV</span><span>P</span>
          </div>
          <div id="league-table-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- OYUN VERİ YAPISI ---
    const POSITIONS = ['GK', 'DF', 'MF', 'FW'];
    
    let gameState = {
      season: 1,
      week: 1,
      userLeagueId: 0, // 0: Süper Lig, 1: 1.Lig
      budget: 150000,
      formation: '4-3-3',
      mentality: 'balanced',
      players: [
        { id: 1, name: "K. Muslera", pos: "GK", skill: 82, form: 90, selected: true, val: 20000, goals: 0 },
        { id: 2, name: "V. van Dijk", pos: "DF", skill: 88, form: 85, selected: true, val: 45000, goals: 1 },
        { id: 3, name: "A. Robertson", pos: "DF", skill: 81, form: 80, selected: true, val: 25000, goals: 0 },
        { id: 4, name: "Ferdi Kadıoğlu", pos: "DF", skill: 80, form: 88, selected: true, val: 30000, goals: 2 },
        { id: 5, name: "M. de Ligt", pos: "DF", skill: 83, form: 82, selected: true, val: 35000, goals: 0 },
        { id: 6, name: "H. Çalhanoğlu", pos: "MF", skill: 85, form: 92, selected: true, val: 40000, goals: 5 },
        { id: 7, name: "K. De Bruyne", pos: "MF", skill: 90, form: 87, selected: true, val: 60000, goals: 7 },
        { id: 8, name: "Arda Güler", pos: "MF", skill: 84, form: 95, selected: true, val: 50000, goals: 6 },
        { id: 9, name: "M. Salah", pos: "FW", skill: 89, form: 89, selected: true, val: 55000, goals: 12 },
        { id: 10, name: "V. Osimhen", pos: "FW", skill: 87, form: 91, selected: true, val: 58000, goals: 14 },
        { id: 11, name: "K. Mbappé", pos: "FW", skill: 92, form: 94, selected: true, val: 80000, goals: 18 },
        { id: 12, name: "Altay Bayındır", pos: "GK", skill: 75, form: 70, selected: false, val: 10000, goals: 0 },
        { id: 13, name: "Cenk Tosun", pos: "FW", skill: 73, form: 75, selected: false, val: 8000, goals: 1 }
      ],
      transferMarket: [
        { id: 101, name: "J. Bellingham", pos: "MF", skill: 88, val: 65000 },
        { id: 102, name: "L. Yamal", pos: "FW", skill: 85, val: 50000 },
        { id: 103, name: "R. Leao", pos: "FW", skill: 84, val: 42000 },
        { id: 104, name: "G. Donnarumma", pos: "GK", skill: 86, val: 38000 }
      ],
      leagues: [
        {
          name: "Süper Lig",
          teams: [
            { id: 0, name: "Anadolu Kaplanları", skill: 85, pts: 0, gf: 0, ga: 0, isUser: true },
            { id: 1, name: "İstanbul SK", skill: 84, pts: 0, gf: 0, ga: 0 },
            { id: 2, name: "Boğaziçi FK", skill: 82, pts: 0, gf: 0, ga: 0 },
            { id: 3, name: "Ege Gücü", skill: 78, pts: 0, gf: 0, ga: 0 },
            { id: 4, name: "Karadeniz Fırtınası", skill: 81, pts: 0, gf: 0, ga: 0 },
            { id: 5, name: "Başkent SK", skill: 76, pts: 0, gf: 0, ga: 0 }
          ]
        },
        {
          name: "1. Lig",
          teams: [
            { id: 10, name: "Bursa Spor", skill: 74, pts: 0, gf: 0, ga: 0 },
            { id: 11, name: "İzmir Gençlik", skill: 72, pts: 0, gf: 0, ga: 0 },
            { id: 12, name: "Ankara Demir", skill: 70, pts: 0, gf: 0, ga: 0 },
            { id: 13, name: "Kocaeli FK", skill: 71, pts: 0, gf: 0, ga: 0 }
          ]
        }
      ]
    };

    // --- UYGULAMA BAŞLATICI ---
    function init() {
      loadSave();
      renderAll();
    }

    function renderAll() {
      document.getElementById('budget-val').innerText = '$' + gameState.budget.toLocaleString();
      document.getElementById('season-val').innerText = gameState.season;
      document.getElementById('week-val').innerText = gameState.week;
      document.getElementById('league-name-val').innerText = gameState.leagues[gameState.userLeagueId].name;

      renderSquad();
      renderTransferMarket();
      renderLeagueTable(gameState.userLeagueId);
      updateTacticsRating();
      updateOpponentInfo();
    }

    // --- KADRO VE TAKTİK İŞLEMLERİ ---
    function renderSquad() {
      const container = document.getElementById('squad-list');
      container.innerHTML = '';

      gameState.players.forEach(p => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.style.opacity = p.selected ? '1' : '0.5';
        row.innerHTML = `
          <span class="pos-badge pos-${p.pos.toLowerCase()}">${p.pos}</span>
          <span style="font-weight:600" onclick="togglePlayer(${p.id})">${p.name} ${p.selected ? '✓' : ''}</span>
          <span>${p.skill}</span>
          <span style="color:var(--success)">%${p.form}</span>
          <span style="color:var(--warning)">⚽${p.goals}</span>
          <button class="btn btn-secondary" style="padding:2px 6px; font-size:10px;" onclick="sellPlayer(${p.id})">Sat</button>
        `;
        container.appendChild(row);
      });
    }

    function togglePlayer(id) {
      const player = gameState.players.find(p => p.id === id);
      const selectedCount = gameState.players.filter(p => p.selected).length;

      if (!player.selected && selectedCount >= 11) {
        alert("İlk 11 için en fazla 11 oyuncu seçebilirsiniz!");
        return;
      }
      player.selected = !player.selected;
      renderSquad();
      updateTacticsRating();
    }

    function updateTacticsRating() {
      const selected = gameState.players.filter(p => p.selected);
      if (selected.length === 0) return;

      const totalSkill = selected.reduce((acc, p) => acc + (p.skill * (p.form / 100)), 0);
      const avg = Math.round(totalSkill / 11);

      document.getElementById('tactics-rating').innerText = `Takım Gücü: %${avg}`;
      return avg;
    }

    function changeTactics() {
      gameState.formation = document.getElementById('formation-select').value;
      gameState.mentality = document.getElementById('mentality-select').value;
      updateTacticsRating();
    }

    // --- PAZAR VE TRANSFER ---
    function renderTransferMarket() {
      const container = document.getElementById('transfer-list');
      container.innerHTML = '';

      gameState.transferMarket.forEach(p => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.style.gridTemplateColumns = '36px 1fr 45px 80px 70px';
        row.innerHTML = `
          <span class="pos-badge pos-${p.pos.toLowerCase()}">${p.pos}</span>
          <span style="font-weight:600">${p.name}</span>
          <span>${p.skill}</span>
          <span style="color:var(--primary); font-family:var(--font-mono);">$${p.val}</span>
          <button class="btn btn-primary" style="padding:2px 6px; font-size:10px;" onclick="buyPlayer(${p.id})">Al</button>
        `;
        container.appendChild(row);
      });
    }

    function buyPlayer(id) {
      const idx = gameState.transferMarket.findIndex(p => p.id === id);
      const player = gameState.transferMarket[idx];

      if (gameState.budget < player.val) {
        alert("Yetersiz Bütçe!");
        return;
      }

      gameState.budget -= player.val;
      player.selected = false;
      player.form = 90;
      player.goals = 0;

      gameState.players.push(player);
      gameState.transferMarket.splice(idx, 1);

      saveGame();
      renderAll();
    }

    function sellPlayer(id) {
      if (gameState.players.length <= 11) {
        alert("Kadroda en az 11 oyuncu olmalıdır!");
        return;
      }

      const idx = gameState.players.findIndex(p => p.id === id);
      const player = gameState.players[idx];

      gameState.budget += Math.round(player.val * 0.8);
      gameState.players.splice(idx, 1);

      saveGame();
      renderAll();
    }

    // --- MAÇ VE SİMÜLASYON MOTORU ---
    function updateOpponentInfo() {
      const league = gameState.leagues[gameState.userLeagueId];
      const opp = league.teams.find(t => !t.isUser);
      document.getElementById('away-team-name').innerText = opp.name;
    }

    function playMatch() {
      const starters = gameState.players.filter(p => p.selected);
      if (starters.length !== 11) {
        alert("Maça başlamak için sahaya tam 11 oyuncu sürmelisiniz!");
        return;
      }

      const box = document.getElementById('commentary-box');
      box.style.display = 'flex';
      box.innerHTML = '';
      document.getElementById('play-btn').style.display = 'none';

      let min = 0;
      let hGoals = 0;
      let aGoals = 0;

      const userPower = updateTacticsRating();
      const opp = gameState.leagues[gameState.userLeagueId].teams.find(t => !t.isUser);
      
      const timer = setInterval(() => {
        min += 15;
        
        // Gol Sansı
        if (Math.random() * userPower > 45) {
          hGoals++;
          const scorer = starters[Math.floor(Math.random() * starters.length)];
          scorer.goals++;
          box.innerHTML = `<div style="color:var(--primary)"><b>${min}' GOL!</b> ${scorer.name} ağları havalandırdı!</div>` + box.innerHTML;
        } else if (Math.random() * opp.skill > 45) {
          aGoals++;
          box.innerHTML = `<div style="color:var(--danger)"><b>${min}' GOL!</b> ${opp.name} golü buldu.</div>` + box.innerHTML;
        }

        document.getElementById('home-score').innerText = hGoals;
        document.getElementById('away-score').innerText = aGoals;

        if (min >= 90) {
          clearInterval(timer);
          document.getElementById('play-btn').style.display = 'inline-flex';
          endWeek(hGoals, aGoals, opp);
        }
      }, 600);
    }

    function endWeek(hGoals, aGoals, opp) {
      const userTeam = gameState.leagues[gameState.userLeagueId].teams.find(t => t.isUser);
      
      userTeam.gf += hGoals; userTeam.ga += aGoals;
      opp.gf += aGoals; opp.ga += hGoals;

      if (hGoals > aGoals) userTeam.pts += 3;
      else if (hGoals === aGoals) { userTeam.pts += 1; opp.pts += 1; }
      else opp.pts += 3;

      gameState.week++;

      if (gameState.week > 10) {
        alert("Sezon Bitti! Küme Düşme / Yükselme Dereceleri Hesaplanıyor...");
        processSeasonEnd();
      }

      saveGame();
      renderAll();
    }

    function processSeasonEnd() {
      gameState.season++;
      gameState.week = 1;
      // Lig Puanlarını Sıfırla
      gameState.leagues.forEach(l => l.teams.forEach(t => { t.pts = 0; t.gf = 0; t.ga = 0; }));
    }

    // --- TABLOLAR VE SEKMELER ---
    function renderLeagueTable(leagueId) {
      const container = document.getElementById('league-table-body');
      container.innerHTML = '';

      const teams = [...gameState.leagues[leagueId].teams].sort((a,b) => b.pts - a.pts || (b.gf-b.ga) - (a.gf-a.ga));

      teams.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = `table-row ${t.isUser ? 'user-team' : ''}`;
        row.innerHTML = `
          <span>${i+1}</span>
          <span>${t.name}</span>
          <span>${(t.gf+t.ga)>0 ? 5:0}</span>
          <span>${t.gf - t.ga}</span>
          <span>${t.pts}</span>
        `;
        container.appendChild(row);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');

      event.target.classList.add('active');
      document.getElementById(`tab-${tab}`).style.display = 'block';
    }

    // --- VERİ KAYDI ---
    function saveGame() {
      localStorage.setItem('fm_ultra_2026', JSON.stringify(gameState));
    }

    function loadSave() {
      const save = localStorage.getItem('fm_ultra_2026');
      if (save) gameState = JSON.parse(save);
    }

    window.onload = init;
  </script>
</body>
</html>
